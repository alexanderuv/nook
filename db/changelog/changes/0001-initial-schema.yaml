# Nook — initial structure schema.
#
# STRUCTURE ONLY: document *content* lives in git (the ArtifactStore); these
# tables hold structure plus a pointer (path + current git version) to each
# document. A project's tenets are documents (kind=tenet) whose content is in git;
# skills are system-level (distributed to the agent), so they have no tables.
#
# Enum codes: status/kind/type are stored as SMALLINT. The meaning lives in the
# application enums, each member carrying an explicit, stable integer (never an
# ordinal, so reordering the enum can't remap existing rows):
#   document.kind   1=manifesto 2=plan 3=rfc 4=design_doc 5=attachment 6=tenet
#   release.status  1=planned 2=in_progress 3=released 4=cancelled
#   epic.status     1=draft 2=in_progress 3=done 4=cancelled
#   task.status     1=todo 2=in_progress 3=done 4=cancelled
#   task.type       1=feature 2=bug 3=chore
#
# Portability notes:
#   * The schema is plain standard SQL — tables, plain UNIQUE / PK / FK
#     constraints, CHECK constraints, and a view. No partial/filtered indexes or
#     other engine-specific capabilities, so it is not tied to any one database.
#   * Column types use Liquibase abstract types so each dialect gets its own
#     (uuid, timestamp, smallint, ...). UUIDs are generated in the application.
#   * Enum domains are SMALLINT codes validated by the application enums, not
#     VARCHAR + CHECK or native ENUM types. The single writer (core service) is
#     the sole inserter, so domain membership is enforced there.
#   * The remaining CHECK constraints and the view are emitted as ANSI-portable SQL.
databaseChangeLog:

  # ── project ────────────────────────────────────────────────────────────────
  - changeSet:
      id: 0001-create-project
      author: nook
      changes:
        - createTable:
            tableName: project
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_project_slug}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: artifact_repo_url, type: varchar(1024)}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}

  # ── release (optional grouping of epics) ────────────────────────────────────
  - changeSet:
      id: 0002-create-release
      author: nook
      changes:
        - createTable:
            tableName: release
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_release_project, references: project(id), deleteCascade: true}}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: status, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=planned
              - column: {name: target_date, type: date}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: release
            columnNames: project_id, slug
            constraintName: uq_release_project_slug
        # referenced by epic's composite FK (enforces same-project membership):
        - addUniqueConstraint:
            tableName: release
            columnNames: project_id, id
            constraintName: uq_release_project_id

  # ── epic ────────────────────────────────────────────────────────────────────
  - changeSet:
      id: 0003-create-epic
      author: nook
      changes:
        - createTable:
            tableName: epic
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_epic_project, references: project(id), deleteCascade: true}}
              - column: {name: release_id, type: uuid}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: status, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=draft
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: epic
            columnNames: project_id, slug
            constraintName: uq_epic_project_slug
        # referenced by task's composite FK (enforces same-project membership):
        - addUniqueConstraint:
            tableName: epic
            columnNames: project_id, id
            constraintName: uq_epic_project_id
        # composite FK: an epic's release must be in the SAME project:
        - addForeignKeyConstraint:
            baseTableName: epic
            baseColumnNames: project_id, release_id
            referencedTableName: release
            referencedColumnNames: project_id, id
            constraintName: fk_epic_release_same_project
            onDelete: SET NULL

  # ── task (belongs to a project; epic is optional) ────────────────────────────
  # A task always has a project_id. epic_id is optional: NULL = a project-level
  # task (e.g. a bug not born inside an epic). The authoritative delete cascade is
  # project → task; the task → epic link is same-project integrity only (NO ACTION),
  # which also avoids multiple cascade paths (some engines forbid them).
  - changeSet:
      id: 0004-create-task
      author: nook
      changes:
        - createTable:
            tableName: task
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_task_project, references: project(id), deleteCascade: true}}
              - column: {name: epic_id, type: uuid}   # optional; NULL = project-level task
              - column: {name: type, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=feature
              - column: {name: slug, type: varchar(200), constraints: {nullable: false}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: status, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=todo
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        # composite FK: a task's epic (when set) must be in the SAME project.
        # NO ACTION (not CASCADE) keeps project → task the only cascade path.
        - addForeignKeyConstraint:
            baseTableName: task
            baseColumnNames: project_id, epic_id
            referencedTableName: epic
            referencedColumnNames: project_id, id
            constraintName: fk_task_epic_same_project
            onDelete: NO ACTION
        # slug unique per project — consistent with epic and release. A task's
        # identity follows its owning project, not the optional epic link, so no
        # per-epic or partial-index scoping is needed (project_id is never NULL).
        - addUniqueConstraint:
            tableName: task
            columnNames: project_id, slug
            constraintName: uq_task_project_slug

  # ── task_dependency (blocked_by) ────────────────────────────────────────────
  - changeSet:
      id: 0005-create-task-dependency
      author: nook
      changes:
        - createTable:
            tableName: task_dependency
            columns:
              - column: {name: task_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_dep_task, references: task(id), deleteCascade: true}}
              - column: {name: depends_on_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_dep_blocker, references: task(id), deleteCascade: true}}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: task_dependency
            columnNames: task_id, depends_on_id
            constraintName: pk_task_dependency
        - createIndex:
            tableName: task_dependency
            indexName: ix_dep_depends_on
            columns:
              - column: {name: depends_on_id}
        - sql:
            sql: ALTER TABLE task_dependency ADD CONSTRAINT ck_dep_no_self_block CHECK (task_id <> depends_on_id)

  # ── document (pointer; content is in git) ───────────────────────────────────
  - changeSet:
      id: 0006-create-document
      author: nook
      changes:
        - createTable:
            tableName: document
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              # exclusive-arc owner: exactly one of the three is set (see CHECK below).
              - column: {name: project_id, type: uuid, constraints: {foreignKeyName: fk_doc_project, references: project(id), deleteCascade: true}}
              - column: {name: epic_id, type: uuid, constraints: {foreignKeyName: fk_doc_epic, references: epic(id), deleteCascade: true}}
              - column: {name: task_id, type: uuid, constraints: {foreignKeyName: fk_doc_task, references: task(id), deleteCascade: true}}
              - column: {name: kind, type: smallint, constraints: {nullable: false}}  # 1=manifesto 2=plan 3=rfc 4=design_doc 5=attachment 6=tenet
              - column: {name: name, type: varchar(300), constraints: {nullable: false}}
              - column: {name: title, type: varchar(500)}
              - column: {name: path, type: varchar(1024), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_document_path}}
              - column: {name: current_version, type: varchar(64)}   # git commit sha; NULL until first write
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        # exactly one owner set (portable CASE form of Postgres num_nonnulls):
        - sql:
            sql: >-
              ALTER TABLE document ADD CONSTRAINT ck_document_single_owner CHECK (
                (CASE WHEN project_id IS NULL THEN 0 ELSE 1 END)
              + (CASE WHEN epic_id    IS NULL THEN 0 ELSE 1 END)
              + (CASE WHEN task_id    IS NULL THEN 0 ELSE 1 END) = 1)

  # Document name uniqueness is carried entirely by the global UNIQUE on
  # `document.path` (uq_document_path, changeSet 0006). A path is the
  # entity-scoped name (e.g. /epics/<slug>/notes.md), so two documents with the
  # same name under the same entity collide on path and are rejected, while the
  # same name may repeat across different entities in a project. No per-owner or
  # per-kind uniqueness is enforced here — that would be domain policy, not
  # structure, and belongs in the write path if ever needed.

  # ── query support indexes ────────────────────────────────────────────────────
  - changeSet:
      id: 0008-query-indexes
      author: nook
      changes:
        - createIndex:
            tableName: epic
            indexName: ix_epic_project_status
            columns:
              - column: {name: project_id}
              - column: {name: status}
        - createIndex:
            tableName: task
            indexName: ix_task_project_status
            columns:
              - column: {name: project_id}
              - column: {name: status}
        - createIndex:
            tableName: task
            indexName: ix_task_epic_status
            columns:
              - column: {name: epic_id}
              - column: {name: status}

  # ── ready_task view (backs get_ready_tasks) ─────────────────────────────────
  # READY = todo(1) and every blocker resolved — done(3) or cancelled(4); a
  # cancelled blocker is abandoned work and must not deadlock downstream tasks.
  - changeSet:
      id: 0009-create-ready-task-view
      author: nook
      changes:
        - createView:
            viewName: ready_task
            selectQuery: >-
              SELECT t.*
              FROM task t
              WHERE t.status = 1
                AND NOT EXISTS (
                  SELECT 1
                  FROM task_dependency d
                  JOIN task b ON b.id = d.depends_on_id
                  WHERE d.task_id = t.id
                    AND b.status NOT IN (3, 4)
                )
