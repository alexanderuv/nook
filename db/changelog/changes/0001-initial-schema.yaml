# Nook — initial structure schema.
#
# STRUCTURE ONLY: document *content* lives in git (the ArtifactStore); these
# tables hold structure plus a pointer (path + current git version) to each
# document. A project's tenets are documents (kind=tenet) whose content is in git;
# skills are system-level (distributed to the agent), so they have no tables.
#
# Work items are one entity, project_item, discriminated by `type`. An epic is a
# container; a task, bug, and chore are leaves. Containment — only an epic parents,
# and leaves never nest — is enforced by the single-writer core service, since the
# type carries that meaning.
#
# A document is project-scoped: it always carries project_id, and an optional
# item_id attaches it to one project item (a composite FK keeps that item in the
# same project). Project-level documents (tenets, README, ADRs, the architecture
# overview) leave item_id NULL. Three kinds carry a level rule, enforced in the
# write path like every per-kind rule (see docs/02): kind=adr requires item_id
# NULL (one decision stream per project, never per epic); kind=architecture
# requires item_id NULL and is a per-project SINGLETON (one living map per
# project); kind=plan requires item_id set (a plan is the route for building one
# item; it cannot float at project level).
#
# Documents of docs/-area kinds (rfc, design_doc, prd, adr, discovery, test_plan,
# retro, spec) carry `seq`, a per-(project, kind) citation number ("RFC-3")
# allocated by the write path from document_sequence; NULL for manifesto, plan,
# attachment, tenet. Numbers are never reused — the counter only increases, so a
# deleted RFC-3 stays retired. See docs/02.
#
# Tenancy & actor shape: project.owner_subject is the tenancy root — the subject
# that owns a project. Every audit column (created_by / updated_by) and owner_subject
# hold a stable *subject* string, shaped like a sign-in identity: a configured
# constant ('system') on a single-user/localhost instance, and the subject asserted
# by the edge gate (e.g. an OIDC `sub`) once Nook is reachable over the internet.
# There is deliberately no users/accounts table in v1 — see ARCHITECTURE.md §8 and
# docs/08.
#
# Enum codes: type/status/kind are stored as SMALLINT. The meaning lives in the
# application enums, each member carrying an explicit, stable integer (never an
# ordinal, so reordering the enum can't remap existing rows):
#   project_item.type    1=epic 2=task 3=bug 4=chore
#   project_item.status  1=todo 2=in_progress 3=done 4=cancelled
#   release.status       1=planned 2=in_progress 3=released 4=cancelled
#   document.kind        1=manifesto 2=plan 3=rfc 4=design_doc 5=attachment 6=tenet
#                        7=prd 8=adr 9=discovery 10=test_plan 11=retro 12=spec
#                        13=architecture
#
# Portability notes:
#   * The schema is plain standard SQL — tables, plain UNIQUE / PK / FK
#     constraints, CHECK constraints, and a view. No partial/filtered indexes or
#     other engine-specific capabilities, so it is not tied to any one database.
#   * Column types use Liquibase abstract types so each dialect gets its own
#     (uuid, timestamp, smallint, ...). UUIDs are generated in the application.
#   * Enum domains are SMALLINT codes validated by the application enums, not
#     VARCHAR + CHECK or native ENUM types. The single writer (core service) is
#     the sole inserter, so domain membership is enforced there.
#   * The remaining CHECK constraint and the view are emitted as ANSI-portable SQL.
databaseChangeLog:

  # ── project ────────────────────────────────────────────────────────────────
  - changeSet:
      id: 0001-create-project
      author: nook
      changes:
        - createTable:
            tableName: project
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_project_slug}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: artifact_repo_url, type: varchar(1024)}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              # owner_subject is the tenancy root: the subject that owns this project
              # (distinct from created_by, which is audit). Single-valued in v1 (one
              # owner); it makes per-owner isolation later a filter, not a migration.
              - column: {name: owner_subject, type: varchar(200), defaultValue: system, constraints: {nullable: false}}

  # ── release (optional grouping of epics) ────────────────────────────────────
  - changeSet:
      id: 0002-create-release
      author: nook
      changes:
        - createTable:
            tableName: release
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_release_project, references: project(id), deleteCascade: true}}
              - column: {name: slug, type: varchar(200), constraints: {nullable: false}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: status, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=planned
              - column: {name: target_date, type: date}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: release
            columnNames: project_id, slug
            constraintName: uq_release_project_slug
        # referenced by project_item's composite FK (enforces same-project membership):
        - addUniqueConstraint:
            tableName: release
            columnNames: project_id, id
            constraintName: uq_release_project_id

  # ── project_item (epic / task / bug / chore) ─────────────────────────────────
  # One entity for all work items, discriminated by `type`. Every item belongs to a
  # project (project_id — the sole delete cascade). parent_id (self-reference) places
  # a leaf under an epic; it is NULL for epics and for project-level leaves. release_id
  # applies to epics. The rules "only an epic parents" and "leaves never nest" live in
  # the core service — the type carries the meaning, so no container/leaf column.
  - changeSet:
      id: 0003-create-project-item
      author: nook
      changes:
        - createTable:
            tableName: project_item
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_item_project, references: project(id), deleteCascade: true}}
              - column: {name: parent_id, type: uuid}    # self-ref; NULL = top-level epic or project-level leaf
              - column: {name: release_id, type: uuid}   # epics only (enforced in the write path)
              - column: {name: type, type: smallint, constraints: {nullable: false}}  # 1=epic 2=task 3=bug 4=chore
              - column: {name: slug, type: varchar(200), constraints: {nullable: false}}
              - column: {name: name, type: varchar(500), constraints: {nullable: false}}
              - column: {name: description, type: clob, defaultValue: ''}
              - column: {name: status, type: smallint, defaultValueNumeric: 1, constraints: {nullable: false}}  # 1=todo
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        # slug unique per project across ALL item types — a slug reference must
        # resolve to exactly one item.
        - addUniqueConstraint:
            tableName: project_item
            columnNames: project_id, slug
            constraintName: uq_item_project_slug
        # referenced by the self parent FK and by document's composite item FK:
        - addUniqueConstraint:
            tableName: project_item
            columnNames: project_id, id
            constraintName: uq_item_project_id
        # composite self-FK: a leaf's parent (an epic) must be in the SAME project.
        # NO ACTION keeps project → project_item the only cascade path.
        - addForeignKeyConstraint:
            baseTableName: project_item
            baseColumnNames: project_id, parent_id
            referencedTableName: project_item
            referencedColumnNames: project_id, id
            constraintName: fk_item_parent_same_project
            onDelete: NO ACTION
        # composite FK: an epic's release must be in the SAME project.
        - addForeignKeyConstraint:
            baseTableName: project_item
            baseColumnNames: project_id, release_id
            referencedTableName: release
            referencedColumnNames: project_id, id
            constraintName: fk_item_release_same_project
            onDelete: SET NULL

  # ── item_dependency (blocked_by, between leaves) ─────────────────────────────
  - changeSet:
      id: 0004-create-item-dependency
      author: nook
      changes:
        - createTable:
            tableName: item_dependency
            columns:
              - column: {name: item_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_dep_item, references: project_item(id), deleteCascade: true}}
              - column: {name: depends_on_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_dep_blocker, references: project_item(id), deleteCascade: true}}
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: item_dependency
            columnNames: item_id, depends_on_id
            constraintName: pk_item_dependency
        - createIndex:
            tableName: item_dependency
            indexName: ix_dep_depends_on
            columns:
              - column: {name: depends_on_id}
        # same-project and leaves-only are write-path rules; self-block is structural:
        - sql:
            sql: ALTER TABLE item_dependency ADD CONSTRAINT ck_dep_no_self_block CHECK (item_id <> depends_on_id)

  # ── document (pointer; content is in git) ───────────────────────────────────
  - changeSet:
      id: 0005-create-document
      author: nook
      changes:
        - createTable:
            tableName: document
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              # every document is project-scoped; item_id optionally attaches it to one item.
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_doc_project, references: project(id), deleteCascade: true}}
              - column: {name: item_id, type: uuid}   # NULL = project-level document (tenets, README, ADRs, architecture). Write-path rules: adr requires NULL; architecture requires NULL + one per project; plan requires NOT NULL
              - column: {name: kind, type: smallint, constraints: {nullable: false}}  # 1=manifesto 2=plan 3=rfc 4=design_doc 5=attachment 6=tenet 7=prd 8=adr 9=discovery 10=test_plan 11=retro 12=spec 13=architecture
              # per-(project, kind) citation number for docs/-area kinds ("RFC-3");
              # NULL for manifesto/plan/attachment/tenet. Allocated by the write
              # path from document_sequence, never reused. Uniqueness is write-path
              # policy, not a constraint: a UNIQUE over a nullable column is not
              # portable (engines disagree on multi-NULL semantics), and the single
              # writer is the sole allocator anyway.
              - column: {name: seq, type: int}
              - column: {name: name, type: varchar(300), constraints: {nullable: false}}
              - column: {name: title, type: varchar(500)}
              - column: {name: path, type: varchar(1024), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_document_path}}
              - column: {name: current_version, type: varchar(64)}   # git commit sha; NULL until first write
              - column: {name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(200), defaultValue: system, constraints: {nullable: false}}
        # item attachment: when item_id is set, (project_id, item_id) must be a real
        # same-project item. NO ACTION so project → document stays the single cascade
        # path (no multiple-cascade-path trouble on strict engines).
        - addForeignKeyConstraint:
            baseTableName: document
            baseColumnNames: project_id, item_id
            referencedTableName: project_item
            referencedColumnNames: project_id, id
            constraintName: fk_doc_item_same_project
            onDelete: NO ACTION

  # ── document_sequence (per-project, per-kind seq allocator) ─────────────────
  # High-water counter behind document.seq. A row per (project, kind), created
  # lazily on first numbered document; next_seq only increases, so numbers are
  # never reused even after the newest document of a kind is deleted (MAX(seq)+1
  # could not guarantee that). Read-assign-increment happens in the single
  # writer's creating transaction.
  - changeSet:
      id: 0008-create-document-sequence
      author: nook
      changes:
        - createTable:
            tableName: document_sequence
            columns:
              - column: {name: project_id, type: uuid, constraints: {nullable: false, foreignKeyName: fk_docseq_project, references: project(id), deleteCascade: true}}
              - column: {name: kind, type: smallint, constraints: {nullable: false}}
              - column: {name: next_seq, type: int, defaultValueNumeric: 1, constraints: {nullable: false}}
        - addPrimaryKey:
            tableName: document_sequence
            columnNames: project_id, kind
            constraintName: pk_document_sequence

  # Document name uniqueness is carried entirely by the global UNIQUE on
  # `document.path` (uq_document_path, changeSet 0005). A path is the entity-scoped
  # name (e.g. /epics/<slug>/notes.md), so two documents with the same name under
  # the same item collide on path and are rejected, while the same name may repeat
  # across different items in a project. No per-item or per-kind uniqueness is
  # enforced here — that would be domain policy, not structure, and belongs in the
  # write path if ever needed.

  # ── query support indexes ────────────────────────────────────────────────────
  - changeSet:
      id: 0006-query-indexes
      author: nook
      changes:
        - createIndex:
            tableName: project_item
            indexName: ix_item_project_type_status
            columns:
              - column: {name: project_id}
              - column: {name: type}
              - column: {name: status}
        - createIndex:
            tableName: project_item
            indexName: ix_item_parent_status
            columns:
              - column: {name: parent_id}
              - column: {name: status}

  # ── ready_item view (backs get_ready_items) ─────────────────────────────────
  # READY = a leaf (type task/bug/chore, not an epic) that is todo(1) with every
  # blocker resolved — done(3) or cancelled(4); a cancelled blocker is abandoned
  # work and must not deadlock downstream items.
  - changeSet:
      id: 0007-create-ready-item-view
      author: nook
      changes:
        - createView:
            viewName: ready_item
            selectQuery: >-
              SELECT i.*
              FROM project_item i
              WHERE i.type IN (2, 3, 4)
                AND i.status = 1
                AND NOT EXISTS (
                  SELECT 1
                  FROM item_dependency d
                  JOIN project_item b ON b.id = d.depends_on_id
                  WHERE d.item_id = i.id
                    AND b.status NOT IN (3, 4)
                )
