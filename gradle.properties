# Task outputs are reused when a task's inputs have not changed, and the
# continuous-integration action already carries the Gradle home between runs, so
# this crosses runs for free: a commit touching nothing a module compiles from
# stops recompiling that module, and stops re-running its tests.
#
# What it costs is worth stating rather than discovering. A test task served from
# the cache is the last run's verdict replayed, not a fresh one — no database
# starts. That is sound exactly as far as the inputs are declared honestly, which
# for these suites means the code, the test code and the dependencies, the
# embedded PostgreSQL binaries among them. Where a fresh verdict is what is
# wanted, `--no-build-cache` is how to ask for one.
org.gradle.caching=true

# The build's own advice, printed at the end of every invocation until now.
# Configuring the projects is done once and replayed rather than repeated.
org.gradle.configuration-cache=true
