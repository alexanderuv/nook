name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run proves nothing about the commit that replaced it. Pushes to
# main are exempt: each one is a distinct state of the branch, and cancelling
# them would leave commits with no verdict at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes anything back. Read access to the checkout is the whole
# requirement, and stating it means a compromised action inherits nothing more.
permissions:
  contents: read

jobs:
  check:
    # Pinned rather than latest: the suite runs prebuilt PostgreSQL binaries, so
    # the runner image is part of what is being tested and should not change
    # underneath a green build without anyone choosing it.
    runs-on: ubuntu-24.04
    # Well above the suite's real cost, and far below the six hours GitHub would
    # otherwise let a wedged job burn.
    timeout-minutes: 20
    steps:
      # Pinned to the majors that declare node24. The runner force-runs older
      # actions on it anyway, so staying behind buys a deprecation warning and
      # no extra stability.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Two targets, because the assembled run hangs off one of its own. It
      # starts three programs and a database, so an ordinary local build does
      # not pay for it — which means this run is the whole of the guard: a
      # change that breaks the assembled system passes `check` and fails here.
      - run: ./gradlew check systemTest

      # A failed run's console tail is not enough to diagnose the database
      # suites, still less the assembled run; the reports are. Uploaded only on
      # failure, which is the only time anybody reads them.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
