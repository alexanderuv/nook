# Pins re-checked against Maven Central 2026-07-21.
# Gradle itself is pinned in gradle/wrapper/gradle-wrapper.properties (9.5.x line:
# Kotlin 2.4.10's fully-supported window ends there).

[versions]
kotlin = "2.4.10"
kotlinxSerialization = "1.11.0"
ktor = "3.5.1"
exposed = "1.3.1"
liquibase = "5.0.3"
postgresql = "42.7.13"
sqliteJdbc = "3.53.2.1"
mcpSdk = "2.0.0"

[libraries]
# Consumed by build-logic only, to put the Kotlin Gradle plugin on the convention-plugin classpath.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcpSdk" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
