# Pins re-checked against Maven Central 2026-07-22.
# Gradle itself is pinned in gradle/wrapper/gradle-wrapper.properties (9.5.x line:
# Kotlin 2.4.10's fully-supported window ends there).

[versions]
kotlin = "2.4.10"
kotlinxSerialization = "1.11.0"
ktor = "3.5.1"
exposed = "1.3.1"
liquibase = "5.0.3"
postgresql = "42.7.13"
mcpSdk = "2.0.0"
# The web container hosting the MCP SDK's servlet-shaped transport. Jetty 12's
# `ee11` flavour is the one speaking the servlet revision (6.1) the SDK is built
# against; the other flavours in the same release speak older ones.
jetty = "12.1.11"
# Reads the bearer token both front doors are presented with. One jar with
# nothing behind it, where the alternatives bring four, six and thirty-seven —
# and it knows about neither a servlet nor a Ktor route, which is what lets one
# reading serve both doors.
nimbusJoseJwt = "10.9.1"
zonkyPostgres = "2.2.2"
# PostgreSQL version for the embedded test binaries (latest 17.x line).
zonkyPostgresBinaries = "17.10.0"

[libraries]
# Consumed by build-logic only, to put the Kotlin Gradle plugins on the convention-plugin classpath.
# The serialization plugin belongs there rather than in the module that needs it: a module
# declaring it gets a buildscript classpath of its own, which loads the Kotlin plugin twice.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcpSdk" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-ee11-servlet = { module = "org.eclipse.jetty.ee11:jetty-ee11-servlet", version.ref = "jetty" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
zonky-embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "zonkyPostgres" }
# Aligns every embedded-postgres-binaries-* artifact (including Zonky's default
# platform set) to the pinned PostgreSQL version; import as a platform.
zonky-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "zonkyPostgresBinaries" }
# Apple-silicon binaries; not in Zonky's default platform set. Version comes from the BOM.
zonky-postgres-binaries-darwin-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8" }
